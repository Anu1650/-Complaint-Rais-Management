<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login - Gram Panchayat</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🏛️ Gram Panchayat - Admin Login</h1>
  </header>
  <main>
    <section class="view active">
      <h2>🔐 Officer Login</h2>
      <form id="loginForm">
        <label>Username
          <input type="text" id="username" autocomplete="username" required />
        </label>
        <label>Password
          <input type="password" id="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="primary">Login</button>
      </form>
      <div id="msg" class="result hidden"></div>
      <p style="margin-top:12px"><a href="index.html">← Back to citizen site</a></p>
    </section>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (res.ok) location.href = 'admin.html';
      else {
        const m = document.getElementById('msg');
        m.classList.remove('hidden');
        m.innerHTML = '❌ ' + data.error;
      }
    });
  </script>
</body>
</html>
